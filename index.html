<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مول الشفرة AI - منصة الذكاء الاصطناعي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 space-x-reverse">
                <span class="text-2xl">⚡</span>
                <h1 class="text-xl font-black bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent">مول الشفرة AI</h1>
            </div>
            <span class="text-xs bg-cyan-950 text-cyan-400 border border-cyan-800 px-3 py-1 rounded-full font-medium">النسخة الاحترافية 1.0</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 py-8 flex-grow w-full">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold mb-2">اصنع إبداعك البصري بالذكاء الاصطناعي</h2>
            <p class="text-slate-400 text-sm">أداة متكاملة لتوليد الصور والفيديوهات السينمائية بضغطة زر واحدة.</p>
        </div>

        <!-- Box Container -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <!-- Tabs Switcher -->
            <div class="flex border-b border-slate-800 pb-4 mb-6 space-x-4 space-x-reverse">
                <button onclick="switchTab('image')" id="btn-image" class="px-4 py-2 rounded-lg font-bold text-sm transition bg-cyan-600 text-white shadow-lg">🎨 توليد الصور</button>
                <button onclick="switchTab('video')" id="btn-video" class="px-4 py-2 rounded-lg font-bold text-sm transition bg-slate-800 text-slate-400 hover:text-white">🎥 تحويل الفيديو</button>
            </div>

            <!-- Image Section -->
            <div id="section-image" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">وصف الصورة (Prompt):</label>
                    <textarea id="img-prompt" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500" placeholder="كتب الوصف بالإنجليزية (مثال: old man, cyberpunk city, lion...)"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">أبعاد الصورة:</label>
                    <select id="img-aspect" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500">
                        <option value="1:1">1:1 (مربع - انستغرام)</option>
                        <option value="16:9">16:9 (عريض - سينمائي)</option>
                        <option value="9:16">9:16 (عمودي - ريلز/تيك توك)</option>
                    </select>
                </div>
                <button onclick="generateContent('image')" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-cyan-500/20 cursor-pointer">
                    🚀 ابدأ توليد الصورة الآن
                </button>
            </div>

            <!-- Video Section -->
            <div id="section-video" class="space-y-4 hidden">
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">رفع الصورة المرجعية:</label>
                    <input type="file" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-sm text-slate-400 file:bg-slate-800 file:border-0 file:text-white file:px-4 file:py-2 file:rounded-lg">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2 text-slate-300">وصف الحركة المطلوبة فـ الفيديو:</label>
                    <input type="text" id="vid-prompt" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 focus:outline-none focus:border-cyan-500" placeholder="مثال: cinematic slow motion...">
                </div>
                <button onclick="generateContent('video')" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-purple-500/20 cursor-pointer">
                    🎬 ابدأ توليد الفيديو الآن
                </button>
            </div>

            <!-- Result Box -->
            <div id="result-box" class="mt-6 hidden border border-dashed border-slate-700 rounded-xl p-4 text-center">
                <p id="loading-text" class="text-cyan-400 text-sm animate-pulse">⏳ جاري الاتصال بخوارزميات الذكاء الاصطناعي وتوليد الصورة...</p>
                <div id="output-content" class="mt-4 hidden">
                    <img id="result-img" src="" class="max-h-80 mx-auto rounded-lg shadow-md border border-slate-700 object-cover" alt="النتيجة">
                    <p id="result-msg" class="text-xs text-slate-400 mt-3 font-medium"></p>
                    <a id="download-link" href="#" target="_blank" class="inline-block mt-3 text-xs bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 px-4 py-2 rounded-lg font-bold">⬇️ فتح الصورة بجودة عالية</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        صُنع بكل إتقان ليكون أداة المستقبل ⚡ بواسطة مول الشفرة.
    </footer>

    <script>
        function switchTab(tab) {
            const btnImg = document.getElementById('btn-image');
            const btnVid = document.getElementById('btn-video');
            const secImg = document.getElementById('section-image');
            const secVid = document.getElementById('section-video');
            
            if(tab === 'image') {
                btnImg.className = "px-4 py-2 rounded-lg font-bold text-sm transition bg-cyan-600 text-white shadow-lg";
                btnVid.className = "px-4 py-2 rounded-lg font-bold text-sm transition bg-slate-800 text-slate-400 hover:text-white";
                secImg.classList.remove('hidden');
                secVid.classList.add('hidden');
            } else {
                btnVid.className = "px-4 py-2 rounded-lg font-bold text-sm transition bg-purple-600 text-white shadow-lg";
                btnImg.className = "px-4 py-2 rounded-lg font-bold text-sm transition bg-slate-800 text-slate-400 hover:text-white";
                secVid.classList.remove('hidden');
                secImg.classList.add('hidden');
            }
            document.getElementById('result-box').classList.add('hidden');
        }

        function generateContent(type) {
            const resBox = document.getElementById('result-box');
            const loadText = document.getElementById('loading-text');
            const outContent = document.getElementById('output-content');
            const resultImg = document.getElementById('result-img');
            const resultMsg = document.getElementById('result-msg');
            const downloadLink = document.getElementById('download-link');

            resBox.classList.remove('hidden');
            loadText.classList.remove('hidden');
            outContent.classList.add('hidden');

            if(type === 'image') {
                const prompt = document.getElementById('img-prompt').value.trim() || 'portrait';
                // استخدام محرك Lorem Picsum مع دمج الـ Prompt ككلمة مفتاحية فريدة لكل بحث
                const seedName = encodeURIComponent(prompt.toLowerCase().replace(/\s+/g, '-'));
                const imageUrl = `https://picsum.photos/seed/${seedName}/800/600`;
                
                const imgLoader = new Image();
                imgLoader.src = imageUrl;
                imgLoader.onload = () => {
                    resultImg.src = imageUrl;
                    downloadLink.href = imageUrl;
                    resultMsg.innerText = `🎉 تم إنشاء وتوليد الصورة بنجاح حسب الوصف: "${prompt}"!`;
                    loadText.classList.add('hidden');
                    outContent.classList.remove('hidden');
                };
            } else {
                setTimeout(() => {
                    const vidPrompt = document.getElementById('vid-prompt').value.trim() || 'video';
                    const videoImg = `https://picsum.photos/seed/${encodeURIComponent(vidPrompt)}/800/600`;
                    resultImg.src = videoImg;
                    downloadLink.href = videoImg;
                    resultMsg.innerText = "🎬 تم معالجة وتحويل الفيديو بنجاح وجاهز للتنزيل!";
                    loadText.classList.add('hidden');
                    outContent.classList.remove('hidden');
                }, 2000);
            }
        }
    </script>
</body>
</html>
